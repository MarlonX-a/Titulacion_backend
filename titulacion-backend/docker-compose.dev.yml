services:
  redis:
    image: redis:7.4-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: mini -dir=/data -ip=0.0.0.0
    env_file:
      - .secrets/seaweedfs.env
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-titulacion_dev}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-seaweedfs-dev-only-change-me}
      S3_BUCKET: ${S3_BUCKET:-titulacion-archivos}
    ports:
      - '127.0.0.1:8333:8333'
    volumes:
      - titulacion_seaweedfs:/data

  minio:
    profiles: ['aistor']
    image: quay.io/minio/aistor/minio:RELEASE.2026-09-19T17-05-25Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: titulacion_dev
      MINIO_ROOT_PASSWORD: minio-dev-only-change-me
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - titulacion_minio:/data
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  titulacion_minio:
  titulacion_seaweedfs:
