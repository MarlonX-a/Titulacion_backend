services:
  redis:
    image: redis:7.4-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # MinIO retiró las imágenes comunitarias minio/minio y quay.io/minio/minio.
    # AIStor es la imagen oficial vigente y conserva compatibilidad con S3.
    image: quay.io/minio/aistor/minio:RELEASE.2026-09-19T17-05-25Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: titulacion_dev
      MINIO_ROOT_PASSWORD: minio-dev-only-change-me
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - titulacion_minio:/data
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  titulacion_minio:
