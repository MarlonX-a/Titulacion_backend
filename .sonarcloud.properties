# Análisis automático de SonarCloud (sin token en el workflow).
# Código de prueba: pruebas de Vitest y la sonda de ataque, que solo se ejecuta contra un entorno de prueba.
# No se excluye ningún archivo de src/ del análisis; solo salidas generadas y dependencias.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=test/**,**/*.spec.ts,**/*.e2e-spec.ts,**/*.attack-spec.ts,scripts/attack-probes.mjs
sonar.exclusions=node_modules/**,dist/**,coverage/**
sonar.sourceEncoding=UTF-8
